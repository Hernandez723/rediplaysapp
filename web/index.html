<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Metrolist Web - YouTube Music Client</title>
  <meta name="description" content="Cliente Web de YouTube Music con sincronización en tiempo real para Metrolist y Rediplays.">
  <meta name="theme-color" content="#141218">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/src/styles/components.css">
</head>
<body>
  <div id="app-container">
    <!-- Sidebar Navigation -->
    <nav class="sidebar">
      <div class="brand">
        <div class="brand-icon">M</div>
        <div class="brand-title">Metrolist</div>
      </div>

      <ul class="nav-links">
        <li>
          <a href="#" class="nav-item active" data-view="home">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Inicio</span>
          </a>
        </li>
        <li>
          <a href="#" class="nav-item" data-view="favorites">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span>Favoritos</span>
          </a>
        </li>
        <li>
          <a href="#" class="nav-item" data-view="playlists">
            <svg viewBox="0 0 24 24"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
            <span>Playlists</span>
          </a>
        </li>
        <li>
          <a href="#" class="nav-item" data-view="history">
            <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
            <span>Historial</span>
          </a>
        </li>
      </ul>

      <div class="sync-status-badge" id="sync-badge" title="Configurar Sincronización en la Nube">
        <div class="sync-dot"></div>
        <span>Sincronización Nube</span>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <div class="top-bar">
        <div class="search-box-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="search-input" class="search-input" placeholder="Buscar canciones, artistas, álbumes...">
        </div>
      </div>

      <div id="view-content"></div>
    </main>

    <!-- Bottom Player Bar -->
    <footer class="bottom-player" id="bottom-player" style="display: none;">
      <div class="player-left">
        <img id="player-thumb" src="" class="player-thumb" alt="Album Art">
        <div class="player-track-info">
          <div id="player-title" class="player-track-title">Título de la canción</div>
          <div id="player-artist" class="player-track-artist">Artista</div>
        </div>
      </div>

      <div class="player-center">
        <div class="player-controls">
          <button id="btn-prev" class="btn-icon" title="Anterior">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button id="btn-play-pause" class="btn-play-pause" title="Reproducir / Pausar">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button id="btn-next" class="btn-icon" title="Siguiente">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>

        <div class="progress-container">
          <span id="current-time" class="time-text">0:00</span>
          <input type="range" id="seek-bar" class="seek-bar" min="0" max="100" value="0">
          <span id="total-time" class="time-text">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <button id="btn-lyrics" class="btn-icon" title="Letras">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </button>
        <svg style="width: 18px; height: 18px; fill: var(--md-sys-color-on-surface-variant);" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1">
      </div>
    </footer>

    <!-- Fullscreen Lyrics Overlay -->
    <div class="lyrics-overlay" id="lyrics-overlay">
      <div class="lyrics-header">
        <h2 style="font-size: 1.5rem; font-weight: 700;">Letras en Tiempo Real</h2>
        <button id="btn-close-lyrics" class="btn-icon">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="lyrics-container" id="lyrics-container"></div>
    </div>

    <!-- Modal: Sincronización con Android -->
    <div class="modal-backdrop" id="sync-modal">
      <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2 style="font-size: 1.3rem; font-weight: 700;">Sincronización Cloudflare</h2>
          <button id="btn-close-sync-modal" class="btn-icon">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
        <p style="color: var(--md-sys-color-on-surface-variant); font-size: 0.9rem;">
          Tus favoritos y playlists se sincronizan automáticamente en Cloudflare D1.
        </p>
        
        <div>
          <label style="font-size: 0.85rem; color: var(--md-sys-color-outline);">Tu Código PIN de Vinculación:</label>
          <div class="code-display" id="my-pairing-code">------</div>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--md-sys-color-surface-container-highest); margin: 8px 0;">

        <div>
          <label style="font-size: 0.85rem; color: var(--md-sys-color-outline);">¿Tienes un código de tu app Android u otro navegador?</label>
          <div style="display: flex; gap: 8px; margin-top: 8px;">
            <input type="text" id="input-remote-code" class="search-input" placeholder="Ej: 849201" style="text-align: center; letter-spacing: 2px; font-weight: bold;">
            <button id="btn-pair-remote" class="btn-primary" style="white-space: nowrap;">Vincular</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal: Añadir a Playlist -->
    <div class="modal-backdrop" id="playlist-modal">
      <div class="modal-content">
        <h2 style="font-size: 1.3rem; font-weight: 700;">Añadir a Playlist</h2>
        <div id="modal-playlist-list" class="song-list" style="max-height: 300px; overflow-y: auto;"></div>
      </div>
    </div>
    <!-- Contenedor de Audio YouTube -->
    <div id="yt-player-container" style="position: fixed; bottom: 85px; right: 20px; width: 200px; height: 120px; opacity: 0.005; pointer-events: none; z-index: 0; overflow: hidden; border-radius: 8px;">
      <div id="yt-player-frame"></div>
    </div>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
