name = "metrolist-web"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

# Vinculación con Cloudflare D1 (Base de datos SQLite)
[[d1_databases]]
binding = "DB"
database_name = "metrolist_db"
database_id = "metrolist-d1-db-id"

# Variables de entorno
[vars]
ENVIRONMENT = "production"
API_VERSION = "1.0.0"
